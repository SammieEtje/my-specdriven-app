<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spec-Driven To-Do Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="demo-panel">
        <!-- T021 -->
        <header
          class="app-header feature-target"
          data-target="app-header"
          data-spec="003:FR-001 003:FR-002 003:FR-014"
          tabindex="0"
        >
          <div>
            <p class="eyebrow">Spec-driven demo</p>
            <h1>To-do board</h1>
          </div>
          <!-- T046 -->
          <span class="badge" data-spec="003:FR-003">7 specs</span>
        </header>

        <!-- T006 A form gives Enter-to-add for free (005:FR-001) -->
        <form class="composer" novalidate data-spec="005:FR-001">
          <!-- T028 -->
          <input
            id="task-input"
            class="feature-target"
            data-spec="003:FR-006 005:FR-004"
            data-target="task-input"
            type="text"
            value="Review onboarding checklist"
            aria-label="Add a task"
          />
          <!-- T027 -->
          <button
            id="add-task-button"
            type="submit"
            disabled
            class="feature-target btn btn-primary"
            data-target="add-task-button"
            data-spec="003:FR-005 005:FR-001"
          >
            Add task
          </button>
          <p id="task-input-error" class="field-error" data-spec="005:FR-004"></p>
        </form>

        <nav class="filters" aria-label="Task filters">
          <!-- T030 -->
          <button
            class="feature-target filter-btn"
            data-target="filter-all"
            data-spec="003:FR-006 005:FR-005"
            aria-pressed="true"
          >
            All
          </button>
          <button
            class="feature-target filter-btn"
            data-target="filter-active"
            data-spec="003:FR-006 005:FR-005"
            aria-pressed="false"
          >
            Active
          </button>
          <button
            class="feature-target filter-btn"
            data-target="filter-completed"
            data-spec="003:FR-006 005:FR-005"
            aria-pressed="false"
          >
            Completed
          </button>
        </nav>

        <section class="task-list-container">
          <ul id="task-list" class="task-list feature-target" data-target="task-list"></ul>

          <!-- T019 -->
          <div
            id="empty-state"
            class="empty-state feature-target"
            data-target="empty-state"
            data-spec="003:FR-003 005:FR-007"
            hidden
          >
            <h3>No tasks yet</h3>
            <p>Start by adding the first item to your spec-driven workflow.</p>
          </div>
        </section>

        <footer class="meta-row">
          <!-- T014 (005) Persist and its status message share one group, so the footer keeps two items -->
          <div class="meta-actions">
            <!-- T027 -->
            <button
              id="save-state"
              class="feature-target btn btn-ghost"
              data-target="save-state"
              data-spec="003:FR-005 005:FR-010"
            >
              Persist demo state
            </button>
            <p id="app-status" class="app-status" role="status" data-spec="005:FR-005 005:FR-010"></p>
          </div>
          <!-- T031 -->
          <span class="status-badge" data-spec="003:FR-010"
            ><span class="status-dot" aria-hidden="true"></span>Live trace enabled</span
          >
        </footer>
      </main>

      <aside class="inspector-panel">
        <!-- T013 (007) The real Spec Kit documents per phase replace the hand-written trace (contracts/ui-panel.md) -->
        <section class="spec-panel" aria-labelledby="spec-panel-title">
          <p class="eyebrow">Spec Kit documents</p>
          <h2 id="spec-panel-title">Specification</h2>

          <p id="spec-selection" class="spec-selection" data-spec="007:FR-012 003:FR-002"></p>

          <div
            id="feature-switcher"
            class="switcher"
            role="group"
            aria-label="Linked features"
            data-spec="007:FR-007"
            hidden
          ></div>

          <div
            id="phase-tabs"
            class="phase-tabs"
            role="tablist"
            aria-label="Workflow phases"
            data-spec="007:FR-001 001:FR-007"
          >
            <button
              id="tab-specify"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="phase-panel"
              tabindex="0"
            >
              specify
            </button>
            <button
              id="tab-clarify"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="phase-panel"
              tabindex="-1"
            >
              clarify
            </button>
            <button
              id="tab-plan"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="phase-panel"
              tabindex="-1"
            >
              plan
            </button>
            <button
              id="tab-tasks"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="phase-panel"
              tabindex="-1"
            >
              tasks
            </button>
            <button
              id="tab-analyze"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="phase-panel"
              tabindex="-1"
            >
              analyze
            </button>
            <button
              id="tab-implement"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="phase-panel"
              tabindex="-1"
            >
              implement
            </button>
          </div>

          <div
            id="doc-switcher"
            class="switcher"
            role="group"
            aria-label="Plan documents"
            data-spec="007:FR-004"
            hidden
          ></div>

          <!-- One focusable scroll region for the document (research R7, axe scrollable-region-focusable) -->
          <div
            id="phase-panel"
            class="phase-panel"
            role="tabpanel"
            tabindex="0"
            aria-labelledby="tab-specify"
            data-spec="007:FR-003 007:FR-005 007:FR-006 007:FR-010 004:FR-009"
          ></div>
        </section>
      </aside>
    </div>

    <!-- T032 -->
    <dialog
      id="task-modal"
      class="task-modal feature-target"
      data-target="task-modal"
      data-spec="001:FR-004 003:FR-008"
      aria-labelledby="task-modal-title"
    >
      <div class="task-modal-panel">
        <div class="task-modal-header">
          <div>
            <p class="eyebrow">Task detail</p>
            <h2 id="task-modal-title">Task details</h2>
          </div>
          <button
            type="button"
            class="task-modal-close feature-target btn btn-secondary"
            data-target="task-modal-close"
            data-spec="001:FR-012 003:FR-005"
            aria-label="Close task dialog"
          >
            Close
          </button>
        </div>

        <!-- T028 -->
        <div class="task-modal-fields">
          <div>
            <label for="task-title-field">Title</label>
            <input
              id="task-title-field"
              class="feature-target"
              data-target="task-title-field"
              data-spec="001:FR-005 003:FR-006"
              type="text"
            />
          </div>
          <div>
            <label for="task-description-field">Toelichting</label>
            <textarea
              id="task-description-field"
              class="feature-target"
              data-target="task-description-field"
              data-spec="001:FR-005 003:FR-006"
              rows="4"
            ></textarea>
          </div>
          <div class="split-fields">
            <div>
              <label for="task-tag-field">Tag</label>
              <input
                id="task-tag-field"
                class="feature-target"
                data-target="task-tag-field"
                data-spec="001:FR-005 003:FR-006"
                type="text"
              />
            </div>
            <div>
              <label for="task-owner-field">Eigenaar</label>
              <input
                id="task-owner-field"
                class="feature-target"
                data-target="task-owner-field"
                data-spec="001:FR-005 003:FR-006"
                type="text"
              />
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
